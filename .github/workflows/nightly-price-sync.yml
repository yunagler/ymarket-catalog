name: Nightly price sync (CRM → site)

# Copies prices and offers from the CRM public catalog into data/products.json and
# rebuilds only what they touch (changed product pages, prices on store-page cards, homepage rail,
# pricing.md / pricing/*.md / prices.csv). Names, slugs and SEO copy are never synced.
# See build/sync-prices-from-crm.js. No secrets: the catalog endpoint is public.

on:
  schedule:
    - cron: '30 23 * * *' # 02:30 Israel summer time (01:30 in winter)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report only, do not commit'
        type: boolean
        default: true
      force_regen:
        description: 'Rebuild every product page and report what changes (never committed)'
        type: boolean
        default: false
      simulate:
        description: 'Test only: fake CRM prices, e.g. 648:70,79:101 (never committed)'
        type: string
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: nightly-price-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync prices from the CRM
        id: sync
        env:
          FORCE_REGEN: ${{ inputs.force_regen && '1' || '' }}
          SIMULATE: ${{ inputs.simulate }}
        run: node build/sync-prices-from-crm.js

      - name: Commit and push
        id: push
        if: steps.sync.outputs.changed == 'true' && (github.event_name == 'schedule' || inputs.dry_run == false)
        run: |
          git config user.name "ymarket-nightly-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/products.json products category pricing.md pricing prices.csv index.html
          git commit -m "chore(prices): nightly sync from CRM — ${{ steps.sync.outputs.summary }}"
          # A push made with GITHUB_TOKEN does not start other workflows, so the
          # deploy is dispatched explicitly below. If master moved meanwhile, fail
          # loudly; the next night picks the change up again.
          git push origin HEAD:master

      - name: Deploy the site
        if: steps.push.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref master
